<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Harvest-Call</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script src="config.js"></script>
</head>
<body class="login-page">
  <main class="login">
    <div class="login-head">
      <div class="brand"><span class="mark" data-icon="leaf"></span>Harvest-Call</div>
      <h1>Who is signing in?</h1>
      <p class="muted">Demo mode: there is no password, just pick a person. What each person can do depends on their role. All data is synthetic.</p>
    </div>

    <p class="banner error" id="notice" role="alert" hidden></p>

    <div class="roles" id="people" role="group" aria-label="People"></div>
    <p class="small muted" id="current" hidden></p>
  </main>
  <script type="module" src="js/login.js"></script>
</body>
</html>
