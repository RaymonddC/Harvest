name: Deploy

# Runs on every push to main (and on demand). Needs the one-time setup in DEPLOY.md,
# section "Automatic deploys": a Workload Identity Federation provider, a deployer service
# account, and the GitHub variables and secrets listed there.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once, and let a running deploy finish instead of cancelling it.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # lets the job exchange its GitHub token for Google credentials

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # matches backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm # deploy.sh builds the React dashboard in frontend/
          cache-dependency-path: frontend/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy gateway, job and dashboard
        env:
          PROJECT: ${{ vars.GCP_PROJECT }}
          REGION: ${{ vars.GCP_REGION }}
          MILL_NAME: ${{ vars.MILL_NAME }}
          DEMO_LANGUAGE: ${{ vars.DEMO_LANGUAGE }}
          FIREBASE_WEB_CONFIG: ${{ vars.FIREBASE_WEB_CONFIG }}
          GEMINI_BACKEND: ${{ vars.GEMINI_BACKEND }}
          GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION }}
          LIVE_MODEL: ${{ vars.LIVE_MODEL }}
          MULTI_CROP: ${{ vars.MULTI_CROP }}
          CALL_AUDIO_BUCKET: ${{ vars.CALL_AUDIO_BUCKET }} # optional: records calls (with consent) into this bucket
          CALL_AUDIO_RETENTION_DAYS: ${{ vars.CALL_AUDIO_RETENTION_DAYS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JOB_TOKEN: ${{ secrets.JOB_TOKEN }} # optional: turns on the Monday job (Cloud Scheduler)
          # Real phone calls (Twilio). Leave the variables unset to keep them off. The auth token is
          # not passed here: it lives in Secret Manager as twilio-auth-token and is mounted by deploy.sh.
          TWILIO_ACCOUNT_SID: ${{ vars.TWILIO_ACCOUNT_SID }}
          TWILIO_FROM_NUMBER: ${{ vars.TWILIO_FROM_NUMBER }}
          REAL_CALLS_ENABLED: ${{ vars.REAL_CALLS_ENABLED }}
          PHONE_CALLS_AT_ONCE: ${{ vars.PHONE_CALLS_AT_ONCE }}
          REAL_CALL_ALLOWLIST: ${{ vars.REAL_CALL_ALLOWLIST }}
          # Text messages and planner alerts (optional).
          MESSAGING_CHANNEL: ${{ vars.MESSAGING_CHANNEL }}
          TWILIO_WHATSAPP_FROM: ${{ vars.TWILIO_WHATSAPP_FROM }}
          PLANNER_ALERT_TO: ${{ vars.PLANNER_ALERT_TO }}
          # Redeploys must not wipe live data, and the deployer account has no right to enable APIs.
          SEED_DEMO_DATA: "false"
          SKIP_API_ENABLE: "true"
        run: bash deploy/deploy.sh
